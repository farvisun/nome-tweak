name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 libglib2.0-bin gsettings-desktop-schemas librsvg2-common desktop-file-utils
      - name: Compile translations and test
        run: |
          make translations
          make test
          desktop-file-validate data/io.github.desktopstudio.DesktopStudio.desktop
      - name: Build release artifacts
        run: /usr/bin/python3 scripts/build_release.py --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-studio-packages
          path: |
            dist/*.deb
            dist/*-linux.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
